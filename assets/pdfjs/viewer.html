<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <script type="module">
      import * as pdfjsLib from './pdf.min.mjs';

      pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.mjs';

      function base64ToBytes(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      function post(message) {
        window.ReactNativeWebView.postMessage(JSON.stringify(message));
      }

      window.extractPdfText = async function extractPdfText(base64) {
        try {
          const doc = await pdfjsLib.getDocument({ data: base64ToBytes(base64) }).promise;
          const pages = [];

          for (let pageNumber = 1; pageNumber <= doc.numPages; pageNumber++) {
            const page = await doc.getPage(pageNumber);
            const viewport = page.getViewport({ scale: 1 });
            const content = await page.getTextContent();

            const items = content.items.map((item) => ({
              str: item.str,
              x: item.transform[4],
              // pdf.js text coordinates are bottom-up (PDF space); normalize to top-down so
              // ascending y is reading order for the app's tokenizer.
              y: viewport.height - item.transform[5],
              width: item.width,
            }));

            pages.push({ items, width: viewport.width, height: viewport.height });
          }

          post({ type: 'result', ok: true, pages });
        } catch (error) {
          post({ type: 'result', ok: false, error: String((error && error.message) || error) });
        }
      };

      post({ type: 'ready' });
    </script>
  </body>
</html>
